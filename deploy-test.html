<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proaslift - Deploy Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 48px 56px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .status {
            display: inline-block;
            background: #22c55e;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 999px;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }
        h1 { font-size: 28px; margin-bottom: 12px; }
        p { font-size: 15px; opacity: 0.8; line-height: 1.6; }
        .meta { margin-top: 24px; font-size: 13px; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="card">
        <span class="status">DEPLOY BAŞARILI</span>
        <h1>Proaslift</h1>
        <p>FTP / cPanel deploy bağlantısı çalışıyor.<br>Bu dosya deploy testidir, silinebilir.</p>
        <div class="meta">deploy-test.html &middot; 2026-06-30</div>
    </div>
</body>
</html>
